services:
  sports-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sports-api
    ports:
      - "127.0.0.1:3000:3000"
    command:
      - sports-api
      - --listen
      - 0.0.0.0:3000
      - --database-url
      - sqlite:///data/sports-api.db
      - --source-fetch-mode
      - auto
      - --browser-command
      - chromium
      - --refresh-interval
      - 10m
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /dev/shm:size=256m,mode=1777
    volumes:
      - sports_api_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
    restart: unless-stopped

volumes:
  sports_api_data:
